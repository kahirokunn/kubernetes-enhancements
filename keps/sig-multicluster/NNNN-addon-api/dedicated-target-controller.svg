<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title description">
  <title id="title">Dedicated add-on controller on cluster-a</title>
  <desc id="description">The AddOn and selected AddOn Manager are on the hub. The AddOn Manager creates a controller dedicated to this AddOn on cluster-a. That controller manages add-on resources locally on cluster-a.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #202020; }
    .zone { stroke: #595959; }
    .zone-label { font-size: 16px; }
    .card { stroke: #595959; }
    .name { font-size: 15px; text-anchor: middle; }
    .detail { font-size: 12px; text-anchor: middle; }
    .flow { fill: none; stroke: #595959; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="260" fill="#ffffff"/>
  <rect class="zone" x="30" y="20" width="460" height="220" fill="#eeeeee"/>
  <text class="zone-label" x="50" y="48">Hub cluster</text>
  <rect class="zone" x="540" y="20" width="530" height="220" fill="#f8f8f8"/>
  <text class="zone-label" x="560" y="48">Target cluster: cluster-a</text>
  <rect class="card" x="60" y="110" width="175" height="70" fill="#fff2cc"/>
  <text class="name" x="147" y="139">AddOn</text>
  <text class="detail" x="147" y="159">cluster-a</text>
  <rect class="card" x="285" y="110" width="175" height="70" fill="#cfe2f3"/>
  <text class="name" x="372" y="149">AddOn Manager</text>
  <rect class="card" x="590" y="110" width="190" height="70" fill="#d9ead3"/>
  <text class="name" x="685" y="139">Dedicated</text>
  <text class="name" x="685" y="159">controller</text>
  <rect class="card" x="830" y="110" width="190" height="70" fill="#ffffff"/>
  <text class="name" x="925" y="149">Add-on resources</text>
  <path class="flow" d="M 237 145 H 283"/>
  <path class="flow" d="M 462 145 H 588"/>
  <path class="flow" d="M 782 145 H 828"/>
</svg>
