<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">An Addon installed on its own cluster</title>
  <desc id="description">An Addon, AddonClass, ClusterProfile, and selected manager share the platform-system namespace. The ClusterProfile access provider points to the same cluster's Kubernetes API server, and the manager installs the OpenTelemetry Collector and reports readiness in Addon status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <rect x="50" y="28" width="860" height="430" fill="#eeeeee" stroke="#595959"/>
  <text x="480" y="54" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Single cluster</text>
  <rect x="105" y="75" width="160" height="42" fill="#fff2cc" stroke="#595959"/>
  <text x="185" y="93" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">AddonClass</text>
  <text x="185" y="108" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">otel-collector</text>
  <rect x="400" y="75" width="170" height="42" fill="#ffffff" stroke="#595959"/>
  <text x="485" y="93" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Selected manager</text>
  <text x="485" y="108" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">reconciles Addon</text>
  <line x1="266" y1="96" x2="398" y2="96" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="332" y="87" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">controllerName</text>

  <rect x="90" y="65" width="780" height="220" rx="6" fill="none" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="101" y="57" width="104" height="16" fill="#eeeeee"/>
  <text x="107" y="69" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#674ea7">ns “platform-system”</text>
  <rect x="160" y="196" width="170" height="58" fill="#d9ead3" stroke="#595959"/>
  <text x="245" y="219" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">ClusterProfile</text>
  <text x="245" y="237" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">local-cluster</text>
  <rect x="460" y="196" width="170" height="58" fill="#fff2cc" stroke="#595959"/>
  <text x="545" y="219" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Addon</text>
  <text x="545" y="237" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">otel-collector-local</text>
  <line x1="458" y1="225" x2="332" y2="225" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="395" y="215" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">clusterProfileRef</text>
  <path d="M 545 194 V 160 H 185 V 119" fill="none" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="354" y="156" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">classRef</text>
  <line x1="245" y1="255" x2="245" y2="350" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="256" y="332" font-family="Arial, sans-serif" font-size="10">accessProviders</text>
  <path d="M 570 96 H 705 V 350" fill="none" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="716" y="332" font-family="Arial, sans-serif" font-size="10">installs</text>

  <rect x="105" y="352" width="320" height="70" fill="#f3f3f3" stroke="#595959"/>
  <text x="265" y="379" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Kubernetes API server</text>
  <text x="265" y="401" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">kubernetes.default.svc.cluster.local</text>
  <rect x="595" y="352" width="220" height="70" fill="#f3f3f3" stroke="#595959"/>
  <text x="705" y="389" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Collector installed</text>
</svg>
