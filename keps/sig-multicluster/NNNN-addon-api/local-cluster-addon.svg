<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title description">
  <title id="title">An AddOn installed on its own cluster</title>
  <desc id="description">An AddOn, AddOnClass, ClusterProfile, and selected AddOn Manager share the platform-system namespace. The ClusterProfile access provider points to the same cluster's Kubernetes API server, and the AddOn Manager installs the OpenTelemetry Collector and reports availability in AddOn status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <rect x="30" y="20" width="900" height="420" fill="#eeeeee" stroke="#595959"/>
  <text x="480" y="48" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Single cluster</text>
  <rect x="70" y="75" width="820" height="225" rx="6" fill="none" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="81" y="67" width="104" height="16" fill="#eeeeee"/>
  <text x="87" y="79" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#674ea7">ns “platform-system”</text>

  <rect x="100" y="100" width="180" height="60" fill="#fff2cc" stroke="#595959"/>
  <text x="190" y="124" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AddOnClass</text>
  <text x="190" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">otel-collector</text>
  <rect x="660" y="100" width="200" height="60" fill="#cfe2f3" stroke="#595959"/>
  <text x="760" y="124" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AddOn Manager</text>
  <text x="760" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">reconciles AddOn</text>
  <line x1="282" y1="130" x2="658" y2="130" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="470" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">spec.manager.name</text>

  <rect x="100" y="215" width="180" height="60" fill="#fff2cc" stroke="#595959"/>
  <text x="190" y="239" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AddOn</text>
  <text x="190" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">otel-collector-local</text>
  <rect x="370" y="215" width="220" height="60" fill="#d9ead3" stroke="#595959"/>
  <text x="480" y="239" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">ClusterProfile</text>
  <text x="480" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">local-cluster</text>
  <line x1="190" y1="213" x2="190" y2="162" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="201" y="190" font-family="Arial, sans-serif" font-size="11">classRef</text>
  <line x1="282" y1="245" x2="368" y2="245" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="325" y="235" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">clusterProfileRef</text>
  <line x1="480" y1="277" x2="480" y2="338" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="491" y="323" font-family="Arial, sans-serif" font-size="11">accessProviders</text>
  <line x1="760" y1="162" x2="760" y2="338" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="771" y="323" font-family="Arial, sans-serif" font-size="11">installs</text>

  <rect x="330" y="340" width="300" height="70" fill="#f3f3f3" stroke="#595959"/>
  <text x="480" y="369" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Kubernetes API server</text>
  <text x="480" y="391" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">kubernetes.default.svc.cluster.local</text>
  <rect x="660" y="340" width="200" height="70" fill="#f3f3f3" stroke="#595959"/>
  <text x="760" y="379" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Collector installed</text>
</svg>
