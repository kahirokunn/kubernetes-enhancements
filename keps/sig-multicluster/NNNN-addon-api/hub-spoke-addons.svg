<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">Addons managed from a hub cluster</title>
  <desc id="description">A hub cluster has one AddonClass and two Addons in the fleet-prod namespace. Each Addon selects the Class and references its target ClusterProfile. The selected manager installs a Collector on each target cluster and reports readiness in each Addon status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <rect x="50" y="28" width="860" height="302" fill="#eeeeee" stroke="#595959"/>
  <text x="480" y="54" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Hub cluster</text>
  <rect x="400" y="75" width="160" height="42" fill="#ffffff" stroke="#595959"/>
  <text x="480" y="93" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Selected manager</text>
  <text x="480" y="108" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">reconciles Addons</text>

  <rect x="80" y="145" width="800" height="175" rx="6" fill="none" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="91" y="137" width="77" height="16" fill="#eeeeee"/>
  <text x="97" y="149" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#674ea7">ns “fleet-prod”</text>
  <rect x="400" y="160" width="160" height="42" fill="#fff2cc" stroke="#595959"/>
  <text x="480" y="178" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">AddonClass</text>
  <text x="480" y="193" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">otel-collector</text>
  <line x1="480" y1="158" x2="480" y2="119" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="490" y="140" font-family="Arial, sans-serif" font-size="10">controllerName</text>
  <text x="280" y="228" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">cluster-a installation</text>
  <text x="680" y="228" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">cluster-b installation</text>

  <rect x="120" y="240" width="120" height="58" fill="#fff2cc" stroke="#595959"/>
  <text x="180" y="263" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Addon</text>
  <text x="180" y="281" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">cluster-a</text>
  <rect x="300" y="240" width="140" height="58" fill="#d9ead3" stroke="#595959"/>
  <text x="370" y="263" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">ClusterProfile</text>
  <text x="370" y="281" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">cluster-a</text>
  <line x1="242" y1="269" x2="298" y2="269" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="270" y="260" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">target</text>

  <rect x="520" y="240" width="120" height="58" fill="#fff2cc" stroke="#595959"/>
  <text x="580" y="263" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Addon</text>
  <text x="580" y="281" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">cluster-b</text>
  <rect x="700" y="240" width="140" height="58" fill="#d9ead3" stroke="#595959"/>
  <text x="770" y="263" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">ClusterProfile</text>
  <text x="770" y="281" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">cluster-b</text>
  <line x1="642" y1="269" x2="698" y2="269" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">target</text>

  <path d="M 180 238 V 212 H 420 V 204" fill="none" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="300" y="207" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">classRef</text>
  <path d="M 580 238 V 212 H 540 V 204" fill="none" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="605" y="207" font-family="Arial, sans-serif" font-size="10">classRef</text>
  <line x1="370" y1="299" x2="270" y2="383" stroke="#595959" marker-end="url(#arrow)"/>
  <line x1="770" y1="299" x2="690" y2="383" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="332" y="342" font-family="Arial, sans-serif" font-size="10">identifies target</text>
  <text x="738" y="342" font-family="Arial, sans-serif" font-size="10">identifies target</text>

  <rect x="155" y="385" width="230" height="68" fill="#f3f3f3" stroke="#595959"/>
  <text x="270" y="411" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">cluster-a</text>
  <text x="270" y="433" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Collector installed</text>
  <rect x="575" y="385" width="230" height="68" fill="#f3f3f3" stroke="#595959"/>
  <text x="690" y="411" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">cluster-b</text>
  <text x="690" y="433" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Collector installed</text>
</svg>
