<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">AddOns managed from a hub cluster</title>
  <desc id="description">A hub cluster has a shared AddOnClass in platform-system and two AddOns with their ClusterProfiles in fleet-prod. Each AddOn selects the shared AddOnClass and references its target ClusterProfile. The selected AddOn Manager installs a Collector on each target cluster and reports availability in each AddOn status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <rect x="30" y="20" width="900" height="320" fill="#eeeeee" stroke="#595959"/>
  <text x="480" y="48" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Hub cluster</text>
  <rect x="360" y="65" width="240" height="50" fill="#cfe2f3" stroke="#595959"/>
  <text x="480" y="86" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AddOn Manager</text>
  <text x="480" y="104" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">reconciles AddOns</text>

  <rect x="355" y="135" width="250" height="80" rx="6" fill="none" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="361" y="127" width="104" height="16" fill="#eeeeee"/>
  <text x="367" y="139" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#674ea7">ns “platform-system”</text>
  <rect x="60" y="235" width="840" height="85" rx="6" fill="none" stroke="#674ea7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="71" y="227" width="77" height="16" fill="#eeeeee"/>
  <text x="77" y="239" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#674ea7">ns “fleet-prod”</text>
  <rect x="400" y="155" width="160" height="50" fill="#fff2cc" stroke="#595959"/>
  <text x="480" y="176" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AddOnClass</text>
  <text x="480" y="194" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">otel-collector</text>
  <line x1="480" y1="153" x2="480" y2="117" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="490" y="127" font-family="Arial, sans-serif" font-size="11">spec.manager.name</text>

  <rect x="80" y="245" width="180" height="60" fill="#fff2cc" stroke="#595959"/>
  <text x="170" y="269" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AddOn</text>
  <text x="170" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">otel-collector-cluster-a</text>
  <rect x="310" y="245" width="140" height="60" fill="#d9ead3" stroke="#595959"/>
  <text x="380" y="269" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">ClusterProfile</text>
  <text x="380" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">cluster-a</text>
  <line x1="262" y1="275" x2="308" y2="275" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="285" y="265" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">target</text>

  <rect x="700" y="245" width="180" height="60" fill="#fff2cc" stroke="#595959"/>
  <text x="790" y="269" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AddOn</text>
  <text x="790" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">otel-collector-cluster-b</text>
  <rect x="510" y="245" width="140" height="60" fill="#d9ead3" stroke="#595959"/>
  <text x="580" y="269" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">ClusterProfile</text>
  <text x="580" y="290" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">cluster-b</text>
  <line x1="698" y1="275" x2="652" y2="275" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="675" y="265" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">target</text>

  <path d="M 170 243 V 225 H 440 V 207" fill="none" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="300" y="217" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">classRef</text>
  <path d="M 790 243 V 225 H 520 V 207" fill="none" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="660" y="217" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">classRef</text>
  <line x1="380" y1="307" x2="380" y2="378" stroke="#595959" marker-end="url(#arrow)"/>
  <line x1="580" y1="307" x2="580" y2="378" stroke="#595959" marker-end="url(#arrow)"/>
  <text x="391" y="362" font-family="Arial, sans-serif" font-size="11">identifies target</text>
  <text x="591" y="362" font-family="Arial, sans-serif" font-size="11">identifies target</text>

  <rect x="290" y="380" width="180" height="70" fill="#f3f3f3" stroke="#595959"/>
  <text x="380" y="408" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">cluster-a</text>
  <text x="380" y="431" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Collector installed</text>
  <rect x="490" y="380" width="180" height="70" fill="#f3f3f3" stroke="#595959"/>
  <text x="580" y="408" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">cluster-b</text>
  <text x="580" y="431" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Collector installed</text>
</svg>
