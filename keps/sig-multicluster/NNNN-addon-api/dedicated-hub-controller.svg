<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="title description">
  <title id="title">Dedicated add-on controller on the hub</title>
  <desc id="description">The AddOn, its selected AddOn Manager, and a controller dedicated to this AddOn are on the hub. The AddOn Manager creates the controller, which manages add-on resources on cluster-a.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #202020; }
    .zone { stroke: #595959; }
    .zone-label { font-size: 16px; }
    .card { stroke: #595959; }
    .name { font-size: 15px; text-anchor: middle; }
    .detail { font-size: 12px; text-anchor: middle; }
    .flow { fill: none; stroke: #595959; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="340" fill="#ffffff"/>
  <rect class="zone" x="30" y="20" width="460" height="300" fill="#eeeeee"/>
  <text class="zone-label" x="50" y="48">Hub cluster</text>
  <rect class="zone" x="540" y="20" width="530" height="300" fill="#f8f8f8"/>
  <text class="zone-label" x="560" y="48">Target cluster: cluster-a</text>
  <rect class="card" x="60" y="95" width="175" height="70" fill="#fff2cc"/>
  <text class="name" x="147" y="124">AddOn</text>
  <text class="detail" x="147" y="144">cluster-a</text>
  <rect class="card" x="285" y="95" width="175" height="70" fill="#cfe2f3"/>
  <text class="name" x="372" y="134">AddOn Manager</text>
  <rect class="card" x="285" y="215" width="175" height="70" fill="#d9ead3"/>
  <text class="name" x="372" y="244">Dedicated</text>
  <text class="name" x="372" y="264">controller</text>
  <rect class="card" x="690" y="215" width="230" height="70" fill="#ffffff"/>
  <text class="name" x="805" y="254">Add-on resources</text>
  <path class="flow" d="M 237 130 H 283"/>
  <path class="flow" d="M 372 167 V 213"/>
  <path class="flow" d="M 462 250 H 688"/>
</svg>
