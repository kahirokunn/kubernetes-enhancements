<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="title description">
  <title id="title">External AddOn Manager delegates to the Amazon Elastic Kubernetes Service add-on API</title>
  <desc id="description">An AddOn is declared on the hub. Its selected AddOn Manager runs outside both clusters and requests installation through the external Amazon Elastic Kubernetes Service add-on API. Amazon Elastic Kubernetes Service provides add-on functionality on cluster-a.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #202020; }
    .zone { stroke: #595959; }
    .zone-label { font-size: 16px; }
    .card { stroke: #595959; }
    .name { font-size: 15px; text-anchor: middle; }
    .detail { font-size: 12px; text-anchor: middle; }
    .flow { fill: none; stroke: #595959; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="340" fill="#ffffff"/>
  <rect class="zone" x="30" y="20" width="310" height="300" fill="#eeeeee"/>
  <text class="zone-label" x="50" y="48">Hub cluster</text>
  <rect class="zone" x="380" y="20" width="340" height="300" fill="#f3f3f3"/>
  <text class="zone-label" x="400" y="48">Outside both clusters</text>
  <rect class="zone" x="760" y="20" width="310" height="300" fill="#f8f8f8"/>
  <text class="zone-label" x="780" y="48">Target cluster: cluster-a</text>
  <rect class="card" x="75" y="95" width="220" height="70" fill="#fff2cc"/>
  <text class="name" x="185" y="124">AddOn</text>
  <text class="detail" x="185" y="144">cluster-a</text>
  <rect class="card" x="440" y="95" width="220" height="70" fill="#cfe2f3"/>
  <text class="name" x="550" y="134">AddOn Manager</text>
  <rect class="card" x="440" y="215" width="220" height="70" fill="#e4dff2"/>
  <text class="name" x="550" y="235" style="font-size: 14px">Amazon Elastic</text>
  <text class="name" x="550" y="254" style="font-size: 14px">Kubernetes Service</text>
  <text class="name" x="550" y="273" style="font-size: 14px">add-on API</text>
  <rect class="card" x="805" y="215" width="220" height="70" fill="#ffffff"/>
  <text class="name" x="915" y="254">Add-on functionality</text>
  <path class="flow" d="M 297 130 H 438"/>
  <path class="flow" d="M 550 167 V 213"/>
  <path class="flow" d="M 662 250 H 803"/>
</svg>
