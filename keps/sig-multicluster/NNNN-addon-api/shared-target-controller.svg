<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title description">
  <title id="title">Shared Flux controller on cluster-a</title>
  <desc id="description">An AddOn on the hub selects an AddOn Manager running on cluster-a. The AddOn Manager creates a HelmRelease for this AddOn. A shared Flux helm-controller on cluster-a handles that release and another release, providing add-on resources on cluster-a.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #202020; }
    .zone { stroke: #595959; }
    .zone-label { font-size: 16px; }
    .card { stroke: #595959; }
    .name { font-size: 15px; text-anchor: middle; }
    .detail { font-size: 12px; text-anchor: middle; }
    .flow { fill: none; stroke: #595959; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="400" fill="#ffffff"/>
  <rect class="zone" x="30" y="20" width="460" height="360" fill="#eeeeee"/>
  <text class="zone-label" x="50" y="48">Hub cluster</text>
  <rect class="zone" x="540" y="20" width="530" height="360" fill="#f8f8f8"/>
  <text class="zone-label" x="560" y="48">Target cluster: cluster-a</text>
  <rect class="card" x="60" y="90" width="175" height="70" fill="#fff2cc"/>
  <text class="name" x="147" y="119">AddOn</text>
  <text class="detail" x="147" y="139">cluster-a</text>
  <rect class="card" x="580" y="90" width="190" height="70" fill="#cfe2f3"/>
  <text class="name" x="675" y="129">AddOn Manager</text>
  <rect class="card" x="580" y="190" width="190" height="70" fill="#e4dff2"/>
  <text class="name" x="675" y="219">HelmRelease</text>
  <text class="detail" x="675" y="239">this AddOn</text>
  <rect class="card" x="830" y="90" width="190" height="70" fill="#e4dff2"/>
  <text class="name" x="925" y="129">Other HelmRelease</text>
  <rect class="card" x="830" y="190" width="190" height="70" fill="#d9ead3"/>
  <text class="name" x="925" y="219">Shared Flux</text>
  <text class="name" x="925" y="239">controller</text>
  <rect class="card" x="830" y="290" width="190" height="70" fill="#ffffff"/>
  <text class="name" x="925" y="329">Add-on resources</text>
  <path class="flow" d="M 237 125 H 578"/>
  <path class="flow" d="M 675 162 V 188"/>
  <path class="flow" d="M 772 225 H 828"/>
  <path class="flow" d="M 925 162 V 188"/>
  <path class="flow" d="M 925 262 V 288"/>
</svg>
