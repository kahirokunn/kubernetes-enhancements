<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title description">
  <title id="title">Shared Flux controller on cluster-a</title>
  <desc id="description">An Addon on the hub selects a manager running on cluster-a. The manager creates a HelmRelease for this Addon. A shared Flux helm-controller on cluster-a handles that release and another release, providing add-on resources on cluster-a.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#595959"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #202020; }
    .zone { stroke: #595959; }
    .zone-label { font-size: 16px; }
    .card { stroke: #595959; }
    .name { font-size: 15px; text-anchor: middle; }
    .detail { font-size: 12px; text-anchor: middle; }
    .flow { fill: none; stroke: #595959; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="400" fill="#ffffff"/>
  <rect class="zone" x="30" y="68" width="460" height="290" fill="#eeeeee"/>
  <text class="zone-label" x="50" y="96">Hub cluster</text>
  <rect class="zone" x="540" y="68" width="530" height="290" fill="#f8f8f8"/>
  <text class="zone-label" x="560" y="96">Target cluster: cluster-a</text>
  <rect class="card" x="60" y="165" width="175" height="70" fill="#fff2cc"/>
  <text class="name" x="147" y="194">Addon</text>
  <text class="detail" x="147" y="214">cluster-a</text>
  <rect class="card" x="580" y="110" width="190" height="60" fill="#cfe2f3"/>
  <text class="name" x="675" y="144">Selected manager</text>
  <rect class="card" x="580" y="215" width="190" height="60" fill="#e4dff2"/>
  <text class="name" x="675" y="244">HelmRelease</text>
  <text class="detail" x="675" y="263">this Addon</text>
  <rect class="card" x="580" y="300" width="190" height="50" fill="#e4dff2"/>
  <text class="name" x="675" y="330">Other HelmRelease</text>
  <rect class="card" x="830" y="225" width="190" height="70" fill="#d9ead3"/>
  <text class="name" x="925" y="254">Shared Flux</text>
  <text class="name" x="925" y="274">controller</text>
  <rect class="card" x="830" y="110" width="190" height="60" fill="#ffffff"/>
  <text class="name" x="925" y="144">Add-on resources</text>
  <path class="flow" d="M 237 200 H 400 V 140 H 578"/>
  <path class="flow" d="M 675 172 V 213"/>
  <path class="flow" d="M 772 245 H 828"/>
  <path class="flow" d="M 772 325 H 805 V 275 H 828"/>
  <path class="flow" d="M 925 223 V 172"/>
</svg>
