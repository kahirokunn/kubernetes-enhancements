<svg xmlns="http://www.w3.org/2000/svg" width="960" height="728" viewBox="0 0 960 728" role="img" aria-labelledby="title description">
  <title id="title">Two slices, one group</title>
  <desc id="description">The inventory namespace of the management API contains NamespaceSameness foo-app, two NamespaceSamenessSlices belonging to that parent, and four ClusterProfiles. Each slice publishes namespace foo-app. Slice foo-app-7k9p2 references profiles cluster-a and cluster-b; slice foo-app-m4q8r references cluster-c and cluster-d. Solid arrows are ClusterProfile references. Dashed lines map profiles to the member clusters they represent. One blue band encloses foo-app across all four clusters: the two slices are parts of one group, grouped by the same controller owner UID.</desc>
