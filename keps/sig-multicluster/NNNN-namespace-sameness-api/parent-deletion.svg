<svg xmlns="http://www.w3.org/2000/svg" width="960" height="625" viewBox="0 0 960 625" role="img" aria-labelledby="title description">
  <title id="title">The relationship lasts until slice deletion</title>
  <desc id="description">Three stages show foreground deletion of a parent with one slice publishing foo-app membership in cluster-a and cluster-b through valid ClusterProfile references. Initially the parent and slice exist and the blue band groups the two namespaces. Next deletion is requested: the parent remains visible with a deletionTimestamp while the slice and band remain. Finally the consumer observes that the slice is deleting or absent: the slice is crossed out and the group band disappears. The parent is still awaiting GC cleanup in this example. GC removes the parent after slice cleanup without waiting for the consumer. Both member clusters and both Namespace objects remain visible. With no other references remaining, the consumer removes the applied relationship; parent existence is not a consumer input.</desc>
