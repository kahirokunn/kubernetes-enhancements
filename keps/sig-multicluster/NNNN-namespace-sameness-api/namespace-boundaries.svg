<svg xmlns="http://www.w3.org/2000/svg" width="960" height="541" viewBox="0 0 960 541" role="img" aria-labelledby="title description">
  <title id="title">Same name, different membership</title>
  <desc id="description">Four dashed frames represent cluster-a through cluster-d. A blue band encloses foo-app in cluster-a and cluster-b, and a separate purple band encloses bar-app in those clusters. A green finance band encloses billing only in cluster-c and cluster-d. The billing Namespace in cluster-a is visibly outside the finance band despite having the same name.</desc>
