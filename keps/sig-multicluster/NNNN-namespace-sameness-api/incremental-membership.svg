<svg xmlns="http://www.w3.org/2000/svg" width="960" height="567" viewBox="0 0 960 567" role="img" aria-labelledby="title description">
  <title id="title">Changing the billing group</title>
  <desc id="description">Three consumer observations show one possible update order for the billing group. The clusters and Namespace objects stay in fixed positions. First the blue band contains a and b. After the addition of c is observed, it contains a, b, and c, temporarily establishing sameness between a and c as well. After removal of a is observed, only b and c are inside the band. The Namespace in a remains present outside the group. This is an example of non-atomic observation, not a prescribed update order.</desc>
