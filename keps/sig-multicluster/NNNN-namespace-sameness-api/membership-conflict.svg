<svg xmlns="http://www.w3.org/2000/svg" width="960" height="487" viewBox="0 0 960 487" role="img" aria-labelledby="title description">
  <title id="title">A conflict blocks only one addition</title>
  <desc id="description">Before the request, team-a contains billing in cluster-a and cluster-b; team-b already contains billing in cluster-c. The request adds cluster-c and cluster-d to team-a. After reconciliation, the blue team-a band still contains a and b and now also contains d, marked with a plus. The purple team-b band still contains c. Only the attempted admission of c is crossed out and remains pending. The accepted a/b/d relationship remains usable.</desc>
